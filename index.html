<!DOCTYPE html>
<html lang="en">
    <head>

        <title>P10-Inspired Landing Page Reveal Animation</title>
        <link rel="stylesheet" href="/styles.css"/>
    </head>
    <body>
        <div class="preloader">
            <div class="intro-title">
                <h1>Nullspace Studios</h1>
            </div>
            <div class="outro-title">

        </div>

            </div>
            <div class="outro-title">

            </div>

            <div class="hero-img">

            <div class="card">

            <footer>
                <p>Scroll Down</p>
